[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisai-compiler"
version = "0.5.0"
description = "A bounded-authority programming language, compiler and secure runtime for AI-native cyber defense"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "AegisAI Project"}]
license = {text = "Apache-2.0"}
dependencies = ["cryptography>=43"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
aegis = "aegisai.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
